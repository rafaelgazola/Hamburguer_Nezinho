{% extends "base.html" %}{% block content %}<section class="hero"><p class="eyebrow">CARDÁPIO DIGITAL</p><h1>Monte seu pedido</h1><p>Escolha seus favoritos e envie direto para a cozinha.</p></section><form method="post" action="{{ url_for('create_order') }}"><label for="customer_name">Nome ou mesa</label><input id="customer_name" name="customer_name" placeholder="Ex.: Mesa 4" required><div class="grid">{% for item in items %}<article class="card"><h2>{{ item.name }}</h2><p>{{ item.description }}</p><strong>R$ {{ '%.2f'|format(item.price)|replace('.', ',') }}</strong><label>Quantidade<input type="number" name="item_{{ item.id }}" min="0" value="0"></label></article>{% endfor %}</div><button type="submit">Enviar pedido para a cozinha</button></form>{% endblock %}
