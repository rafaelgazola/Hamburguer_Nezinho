<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171513"><title>{% block title %}Cardápio{% endblock %} | O Lancheiro</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header><a class="brand" href="{{ url_for('menu') }}">🍔 O lancheiro the big nezinho</a><nav><a href="{{ url_for('kitchen') }}">Cozinha</a><a href="{{ url_for('dashboard') }}">Dono</a></nav></header>
<main class="page-shell">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer class="site-footer"><span>Feito na chapa, servido com atitude.</span><span>© O Lancheiro</span></footer>
</body></html>
